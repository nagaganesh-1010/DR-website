// ---------- deterministic hash ----------
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; } return h; }

// ---------- demo images (inline SVG, clearly simulated) ----------
function fundusSVG(grade, seed){
  const rnd = (n)=> { seed = (seed*9301+49297)%233280; return (seed/233280)*n; };
  let lesions='';
  const counts = {no_apparent:0, mild:3, moderate:7, severe:13, proliferative:9, ungradable:2};
  const n = counts[grade] ?? 3;
  const colors = grade==='proliferative' ? ['#B91C1C','#7F1D1D'] : ['#DC2626','#F59E0B'];
  for(let i=0;i<n;i++){
    const ang = rnd(360); const rad = 60+rnd(95);
    const cx = 200 + rad*Math.cos(ang*Math.PI/180);
    const cy = 200 + rad*Math.sin(ang*Math.PI/180);
    const r = grade==='proliferative' ? 5+rnd(6) : 2.5+rnd(3.5);
    const c = colors[i%colors.length];
    lesions += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${c}" opacity="0.85"/>`;
  }
  if(grade==='proliferative'){
    for(let i=0;i<4;i++){
      const ang = rnd(360); const rad=100+rnd(50);
      const x1=200+70*Math.cos(ang*Math.PI/180), y1=200+70*Math.sin(ang*Math.PI/180);
      const x2=200+rad*Math.cos((ang+18)*Math.PI/180), y2=200+rad*Math.sin((ang+18)*Math.PI/180);
      lesions += `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} Q${(200+rad*0.6*Math.cos((ang+9)*Math.PI/180)).toFixed(1)},${(200+rad*0.6*Math.sin((ang+9)*Math.PI/180)).toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}" stroke="#7F1D1D" stroke-width="2.4" fill="none" opacity="0.8"/>`;
    }
  }
  const blur = grade==='ungradable' ? 'filter="url(#blurf)"' : '';
  return `
  <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simulated demo fundus image, not a real patient photograph">
    <defs>
      <radialGradient id="fbg-${grade}" cx="50%" cy="50%" r="65%">
        <stop offset="0%" stop-color="#F5A25D"/><stop offset="55%" stop-color="#D9713C"/><stop offset="100%" stop-color="#7A3418"/>
      </radialGradient>
      <filter id="blurf"><feGaussianBlur stdDeviation="6"/></filter>
    </defs>
    <circle cx="200" cy="200" r="196" fill="url(#fbg-${grade})"/>
    <g ${blur}>
      <circle cx="200" cy="200" r="34" fill="#F7C98A" opacity="0.9"/>
      <circle cx="200" cy="200" r="14" fill="#FBE3B8"/>
      <path d="M200,200 C170,140 120,120 60,118" stroke="#8E2A14" stroke-width="5" fill="none" opacity="0.75"/>
      <path d="M200,200 C230,150 280,130 340,140" stroke="#8E2A14" stroke-width="5" fill="none" opacity="0.75"/>
      <path d="M200,200 C165,255 130,290 80,320" stroke="#7A2210" stroke-width="4.5" fill="none" opacity="0.7"/>
      <path d="M200,200 C240,260 285,285 335,300" stroke="#7A2210" stroke-width="4.5" fill="none" opacity="0.7"/>
      <path d="M200,200 C190,150 175,110 165,60" stroke="#8E2A14" stroke-width="3.5" fill="none" opacity="0.6"/>
      <path d="M200,200 C215,255 230,300 245,350" stroke="#7A2210" stroke-width="3.5" fill="none" opacity="0.6"/>
      ${lesions}
    </g>
    <circle cx="200" cy="200" r="196" fill="none" stroke="#5A2410" stroke-width="4" opacity="0.5"/>
  </svg>`;
}
function heatmapSVG(grade, seed){
  const rnd = (n)=> { seed=(seed*9301+49297)%233280; return (seed/233280)*n; };
  const spots = {no_apparent:1, mild:2, moderate:4, severe:6, proliferative:5, ungradable:1};
  const n = spots[grade] ?? 2;
  let blobs='';
  for(let i=0;i<n;i++){
    const ang=rnd(360), rad=50+rnd(100);
    const cx=200+rad*Math.cos(ang*Math.PI/180), cy=200+rad*Math.sin(ang*Math.PI/180);
    const r = 22+rnd(30);
    const heat = grade==='severe'||grade==='proliferative' ? '#EF4444' : (grade==='moderate' ? '#F59E0B' : '#FBBF24');
    blobs += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}" fill="${heat}" opacity="0.55" filter="url(#soft)"/>`;
  }
  return `
  <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Simulated demo heatmap overlay">
    <defs><filter id="soft"><feGaussianBlur stdDeviation="14"/></filter></defs>
    ${blobs}
  </svg>`;
}

// ---------- mock AI service ----------
function mockScreening(imageKey, fixedGrade){
  const h = hashStr(imageKey);
  const grade = fixedGrade || GRADES[h % (GRADES.length-1)]; // exclude ungradable from pure-hash unless fixed
  const confidence = grade==='ungradable' ? (40 + (h%15)) : (68 + (h%29));
  return {
    screening_result: grade,
    confidence: confidence,
    model_version: 'demo-mock-v0',
    explanation_svg: heatmapSVG(grade, h%1000),
    original_svg: fundusSVG(grade, h%1000),
    is_demo: true,
    next_step: GRADE_INFO[grade].next,
    simple_explanation: GRADE_INFO[grade].meaning,
  };
}

function seedScreenings(){
  const eyes=['right','left'];
  const arr=[];
  const grades=['no_apparent','no_apparent','mild','moderate','no_apparent','severe','mild','proliferative','ungradable','moderate'];
  for(let i=0;i<10;i++){
    const grade = grades[i];
    const h = hashStr('seed-'+i+grade);
    arr.push({
      id: 'scr_'+(1000+i),
      patientCode: 'NS-2026-'+(120+i*3),
      date: new Date(Date.now() - i*86400000*1.6).toISOString().slice(0,10),
      eye: eyes[i%2],
      grade: grade,
      confidence: grade==='ungradable' ? 44 : (66+(h%30)),
      status: grade==='no_apparent' ? 'Reviewed' : (grade==='ungradable' ? 'Retake needed' : 'Needs review'),
      seed: h%1000,
    });
  }
  return arr;
}

function DonutChart(counts){
  const total = Object.values(counts).reduce((a,b)=>a+b,0) || 1;
  const colorMap = {no_apparent:'#15803D',mild:'#CA8A04',moderate:'#EA580C',severe:'#DC2626',proliferative:'#7F1D1D',ungradable:'#78716C'};
  let acc = 0; const stops=[];
  GRADES.forEach(g=>{ const v=counts[g]||0; const pct = v/total*100; stops.push(`${colorMap[g]} ${acc}% ${acc+pct}%`); acc+=pct; });
  return `<div class="flex items-center gap-5">
    <div class="w-32 h-32 rounded-full shrink-0" style="background:conic-gradient(${stops.join(',')})">
      <div class="w-full h-full rounded-full grid place-items-center"><div class="w-16 h-16 bg-white rounded-full grid place-items-center font-display font-bold text-sm">${total}</div></div>
    </div>
    <div class="space-y-1.5 text-sm">
      ${GRADES.map(g=>`<div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full" style="background:${colorMap[g]}"></span><span class="text-ns-ink/70">${gLabel(g)}</span><span class="font-medium">${counts[g]||0}</span></div>`).join('')}
    </div>
  </div>`;
}

function runAnalysisSequence(){
  const labels = [t('analyzing_1'),t('analyzing_2'),t('analyzing_3'),t('analyzing_4'),t('analyzing_5')];
  let i=0;
  const labelEl = document.getElementById('analyzeLabel');
  const barEl = document.getElementById('analyzeBar');
  if(!labelEl) return;
  const iv = setInterval(()=>{
    i++;
    if(i>=labels.length){
      clearInterval(iv);
      const w = STATE.wizard;
      const fixedGrade = DEMO_IMAGES.find(d=>d.key===w.imageKey)?.grade;
      const result = mockScreening(w.imageKey, w.imageGrade || fixedGrade);
      const id = 'scr_'+Date.now();
      const record = { id, patientCode: w.patientCode || patientCodeGen(), date: new Date().toISOString().slice(0,10),
        eye: w.eyeSel==='both'?'right':w.eyeSel, grade: result.screening_result, confidence: result.confidence,
        status: result.screening_result==='no_apparent'?'Reviewed':(result.screening_result==='ungradable'?'Retake needed':'Needs review'),
        seed: hashStr(w.imageKey)%1000, imageKey: w.imageKey };
      STATE.screenings.unshift(record);
      STATE.currentResult = record;
      navigate('#/screening/result/'+id);
      return;
    }
    labelEl.textContent = labels[i];
    barEl.style.width = (10 + i*22)+'%';
  }, 620);
}

    start_screening: {en:'Opening a new screening for you now.',hi:'अभी आपके लिए नई जांच खोल रहा हूँ।',te:'ఇప్పుడు మీ కోసం కొత్త స్క్రీనింగ్ తెరుస్తున్నాను.'},
    explain_result: latest ? { en:`Your latest demo result is ${gLabel(latest.grade)}. ${(gInfo(latest.grade).meaning[L]||gInfo(latest.grade).meaning.en)}`,
      hi:`आपका नवीनतम डेमो परिणाम ${gLabel(latest.grade)} है। ${(gInfo(latest.grade).meaning.hi)}`,
      te:`మీ తాజా డెమో ఫలితం ${gLabel(latest.grade)}. ${(gInfo(latest.grade).meaning.te)}` } : {en:'No screenings yet. Start a new screening first.',hi:'अभी तक कोई जांच नहीं। पहले नई जांच शुरू करें।',te:'ఇంకా స్క్రీనింగ్‌లు లేవు. ముందుగా కొత్త స్క్రీనింగ్ ప్రారంభించండి.'},
    read_result: latest ? hearResultScript(latest) : {en:'No screenings yet.',hi:'अभी तक कोई जांच नहीं।',te:'ఇంకా స్క్రీనింగ్‌లు లేవు.'},
    change_language: {en:'You can switch language using the buttons above.',hi:'आप ऊपर दिए बटन से भाषा बदल सकते हैं।',te:'మీరు పైన ఉన్న బటన్లను ఉపయోగించి భాషను మార్చవచ్చు.'},
    go_dashboard: {en:'Going to the dashboard.',hi:'डैशबोर्ड पर जा रहा हूँ।',te:'డాష్‌బోర్డ్‌కు వెళ్తున్నాను.'},
    go_photo: {en:'Opening the photo guide.',hi:'फोटो गाइड खोल रहा हूँ।',te:'ఫోటో గైడ్ తెరుస్తున్నాను.'},
    go_disclaimer: {en:'Opening the disclaimer.',hi:'अस्वीकरण खोल रहा हूँ।',te:'నిరాకరణ తెరుస్తున్నాను.'},
    what_is_dr: {en:'Diabetic retinopathy is eye damage that can happen over time due to diabetes affecting the retina. Regular screening helps catch changes early.',
      hi:'डायबिटिक रेटिनोपैथी मधुमेह के कारण समय के साथ रेटिना को होने वाली आंख की क्षति है। नियमित जांच से बदलावों को जल्दी पकड़ने में मदद मिलती है।',
      te:'డయాబెటిక్ రెటినోపతి అనేది మధుమేహం వల్ల కాలక్రమేణా రెటినాకు జరిగే కంటి నష్టం. క్రమం తప్పకుండా స్క్రీనింగ్ మార్పులను ముందుగానే గుర్తించడంలో సహాయపడుతుంది.'},
    how_upload: {en:'On the New Screening page, drag and drop a retinal photo, or tap Browse, or choose a demo image.',
      hi:'नई जांच पृष्ठ पर, रेटिना फोटो खींचें और छोड़ें, या ब्राउज़ पर टैप करें, या डेमो चित्र चुनें।',
      te:'కొత్త స్క్రీనింగ్ పేజీలో, రెటినా ఫోటోను లాగి వదలండి, లేదా బ్రౌజ్ నొక్కండి, లేదా డెమో చిత్రాన్ని ఎంచుకోండి.'},
  };
  return (dic[cmd] && (dic[cmd][L]||dic[cmd].en)) || t('voice_unsafe');
}

function hearResultScript(s){
  const g = gInfo(s.grade);
  return {
    en:`This is a demo AI-assisted screening result, not a medical diagnosis. The sample output is: ${g.label.en}. ${g.next.en} Please consult a qualified eye-care professional for further evaluation.`,
    hi:`यह एक डेमो AI-सहायता प्राप्त जांच परिणाम है, चिकित्सीय निदान नहीं। नमूना आउटपुट है: ${g.label.hi}। ${g.next.hi} आगे के मूल्यांकन के लिए कृपया एक योग्य नेत्र-देखभाल पेशेवर से परामर्श करें।`,
    te:`ఇది డెమో AI-సహాయక స్క్రీనింగ్ ఫలితం, వైద్య నిర్ధారణ కాదు. నమూనా అవుట్‌పుట్: ${g.label.te}. ${g.next.te} తదుపరి మూల్యాంకనం కోసం దయచేసి అర్హత గల కంటి-సంరక్షణ నిపుణుడిని సంప్రదించండి.`,
  };
}

// ===================== APP CONTROLLER =====================
const App = {
  setLang(code){ STATE.lang = code; render(); },
  togglePw(){
    const el = document.getElementById('loginPass');
    if(!el) return;
    el.type = el.type==='password' ? 'text':'password';
  },
  quickLogin(email){
    const roleMap = {'worker@netrasetu.demo':'worker','doctor@netrasetu.demo':'doctor','admin@netrasetu.demo':'admin'};
    STATE.user = { email, role: roleMap[email] || 'worker' };
    navigate('#/dashboard');
  },
  login(ev){
    ev.preventDefault();
    const email = document.getElementById('loginEmail').value || 'worker@netrasetu.demo';
    const roleMap = {'worker@netrasetu.demo':'worker','doctor@netrasetu.demo':'doctor','admin@netrasetu.demo':'admin'};
    STATE.user = { email, role: roleMap[email] || 'worker' };
    navigate('#/dashboard');
  },
  logout(){ STATE.user = null; navigate('#/'); },
  toggleDrawer(open){
    const d = document.getElementById('mobileDrawer');
    if(!d) return;
    d.classList.toggle('hidden', !open);
  },

  // wizard
  setWizard(key,val){ STATE.wizard[key]=val; render(); },
  genCode(){ STATE.wizard.patientCode = patientCodeGen(); render(); },
  resetWizard(){ STATE.wizard = { step:1, patientCode:'', ageRange:'', gender:'', diabetes:'not_sure', eyeSel:'right', consent:false, imageKey:null, imageGrade:null, isBlurryGate:false, customName:null }; },
  wizardNext1(){
    const w = STATE.wizard;
    w.patientCode = document.getElementById('w_patientCode').value || patientCodeGen();
    w.ageRange = document.getElementById('w_age').value;
    w.gender = document.getElementById('w_gender').value;
    w.consent = document.getElementById('w_consent').checked;
    w.step = 2;
    render();
  },
  pickDemoImage(key, grade, blurryGate){
    STATE.wizard.imageKey = key; STATE.wizard.imageGrade = grade; STATE.wizard.isBlurryGate = !!blurryGate; STATE.wizard.customName=null;
    render();
  },
  handleFileInput(ev){
    const file = ev.target.files[0];
    if(!file) return;
    const h = hashStr(file.name+file.size);
    const grade = GRADES[h % (GRADES.length-1)];
    STATE.wizard.imageKey = 'upload-'+file.name; STATE.wizard.imageGrade = grade; STATE.wizard.isBlurryGate=false; STATE.wizard.customName = file.name;
    render();
  },
  handleDrop(ev){
    ev.preventDefault();
    const dz = document.getElementById('dropzone'); if(dz) dz.classList.remove('border-ns-cyan-500');
    const file = ev.dataTransfer.files[0];
    if(!file) return;
    const h = hashStr(file.name+file.size);
    const grade = GRADES[h % (GRADES.length-1)];
    STATE.wizard.imageKey = 'upload-'+file.name; STATE.wizard.imageGrade = grade; STATE.wizard.isBlurryGate=false; STATE.wizard.customName = file.name;
    render();
  },
  removeImage(){ STATE.wizard.imageKey=null; STATE.wizard.imageGrade=null; STATE.wizard.isBlurryGate=false; STATE.wizard.customName=null; render(); },
  wizardNext2(){ STATE.wizard.step = 3; render(); },
  startAnalysis(){
    navigate('#/screening/analyze');
    setTimeout(runAnalysisSequence, 60);
  },

  // result page
  moveSlider(val){
    const layer = document.getElementById('heatLayer');
    if(layer) layer.style.clipPath = `inset(0 0 0 ${val}%)`;
    const handle = document.getElementById('sliderHandle');
    if(handle) handle.style.left = val+'%';
  },
  hearResult(id){
    const s = findScreening(id);
    if(!s) return;
    const script = hearResultScript(s)[STATE.lang] || hearResultScript(s).en;
    speak(script);
  },

  // patients / history filters
  filterPatients(q){
    q = q.toLowerCase();
    document.querySelectorAll('#patientsBody tr').forEach(tr=>{
      tr.style.display = tr.dataset.code.includes(q) ? '' : 'none';
    });
  },
  filterHistory(grade){
    document.querySelectorAll('#historyBody tr').forEach(tr=>{
      tr.style.display = (!grade || tr.dataset.grade===grade) ? '' : 'none';
    });
  },

  // accessibility
  setFontSize(v){
    STATE.a11y.fontSize = v;
    document.body.classList.remove('a11y-large');
    if(v==='large') document.body.classList.add('a11y-large');
    render();
  },
  toggleContrast(){ STATE.a11y.highContrast = !STATE.a11y.highContrast; render(); },
  toggleVoiceGuidance(){ STATE.a11y.voiceGuidance = !STATE.a11y.voiceGuidance; render(); },

  // voice assistant
  toggleMic(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ document.getElementById('voiceTranscript').textContent = t('mic_not_supported'); return; }
    const rec = new SR();
    rec.lang = STATE.lang==='hi' ? 'hi-IN' : STATE.lang==='te' ? 'te-IN' : 'en-IN';
    rec.onresult = (e)=>{
      const text = e.results[0][0].transcript;
      document.getElementById('voiceTranscript').textContent = text;
      App.processVoiceText(text);
    };
    rec.onerror = ()=>{ document.getElementById('voiceTranscript').textContent = t('mic_not_supported'); };
    rec.start();
  },
  processVoiceText(text){
    const low = text.toLowerCase();
    let cmd = null;
    if(/screen|जांच|స్క్రీన/.test(low)) cmd='start_screening';
    else if(/explain|result|परिणाम|ఫలిత/.test(low)) cmd='explain_result';
    else if(/read|सुनाओ|చదవ/.test(low)) cmd='read_result';
    else if(/dashboard|डैशबोर्ड|డాష్‌బోర్డ్/.test(low)) cmd='go_dashboard';
    else if(/photo|फोटो|ఫోటో/.test(low)) cmd='go_photo';
    else if(/disclaimer|अस्वीकरण|నిరాకరణ/.test(low)) cmd='go_disclaimer';
    else if(/what is|diabetic retinopathy|रेटिनोपैथी|రెటినోపతి/.test(low)) cmd='what_is_dr';
    else if(/upload|अपलोड|అప్‌లోడ్/.test(low)) cmd='how_upload';
    if(cmd) App.voiceCommand(cmd); else App.showVoiceReply(t('voice_unsafe'), true);
  },
  voiceCommand(cmd){
    const reply = voiceReplyFor(cmd);
    App.showVoiceReply(reply);
    speak(reply);
    const navMap = { start_screening:'#/screening/new', go_dashboard:'#/dashboard', go_photo:'#/photo-guide', go_disclaimer:'#/disclaimer' };
    if(navMap[cmd]) setTimeout(()=>navigate(navMap[cmd]), 900);
  },
  showVoiceReply(text){
    const box = document.getElementById('voiceReplyBox');
    if(!box) return;
    box.textContent = text; box.classList.remove('hidden');
  },
  speakControl(action){
    if(action==='stop'){ window.speechSynthesis && window.speechSynthesis.cancel(); }
    else if(action==='pause'){ window.speechSynthesis && window.speechSynthesis.pause(); }
    else if(action==='play'){ window.speechSynthesis && window.speechSynthesis.resume(); }
    else if(action==='replay' && STATE.voice.lastUtterance){ speak(STATE.voice.lastUtterance); }
  },
};

function speak(text){
  STATE.voice.lastUtterance = text;
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = STATE.lang==='hi' ? 'hi-IN' : STATE.lang==='te' ? 'te-IN' : 'en-IN';
  window.speechSynthesis.speak(u);
}

// ===================== ROUTER =====================
function render(){
  const app = document.getElementById('app');
  const parts = routeParts();
  let html = '';

  if(parts.length===0){ html = Landing(); }
  else if(parts[0]==='how-it-works'){ html = HowItWorks(); }
  else if(parts[0]==='disclaimer'){ html = STATE.user ? AppShell(t('disclaimer_title'), DisclaimerInner()) : Disclaimer(); }
  else if(parts[0]==='login'){ html = STATE.user ? (navigate('#/dashboard'), '') : Login(); }
  else if(parts[0]==='dashboard'){ if(!requireAuth()) return; html = Dashboard(); }
  else if(parts[0]==='screening' && parts[1]==='new'){ if(!requireAuth()) return; html = NewScreeningPage(); }
  else if(parts[0]==='screening' && parts[1]==='analyze'){ if(!requireAuth()) return; html = AnalysisPage(); }
  else if(parts[0]==='screening' && parts[1]==='result'){ if(!requireAuth()) return; html = ResultPage(parts[2]); }
  else if(parts[0]==='reports'){ if(!requireAuth()) return; html = ReportPage(parts[1]); }
  else if(parts[0]==='patients'){ if(!requireAuth()) return; html = PatientsPage(); }
  else if(parts[0]==='history'){ if(!requireAuth()) return; html = HistoryPage(); }
  else if(parts[0]==='voice-assistant'){ if(!requireAuth()) return; html = VoiceAssistantPage(); }
  else if(parts[0]==='photo-guide'){ if(!requireAuth()) return; html = PhotoGuidePage(); }
  else if(parts[0]==='accessibility'){ if(!requireAuth()) return; html = AccessibilityPage(); }
  else if(parts[0]==='settings'){ if(!requireAuth()) return; html = SettingsPage(); }
  else { html = Landing(); }

  if(html==='') return;
  app.innerHTML = `<div class="fade-in">${html}</div>`;
  window.scrollTo({top:0, behavior:'instant'});
  if(window.lucide) lucide.createIcons();
}

render();
</script>
